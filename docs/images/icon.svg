<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Freshet app icon: a river running down into a download arrow, on a macOS icon grid
       (824 pt tile at 100,100 with a 185 pt corner radius). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36D1B9"/>
      <stop offset="0.55" stop-color="#1279C4"/>
      <stop offset="1" stop-color="#0B3F86"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F6FF"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="arrowShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#062B5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <!-- water at the foot of the tile -->
    <path d="M100 772 C 230 718, 370 826, 512 772 S 796 718, 924 772 L 924 924 L 100 924 Z" fill="#5ED8F0" fill-opacity="0.32"/>
    <path d="M100 836 C 250 796, 380 876, 524 836 S 806 796, 924 836 L 924 924 L 100 924 Z" fill="#BDF1FF" fill-opacity="0.20"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
  <!-- the river: a winding stream that becomes a download arrow -->
  <g filter="url(#arrowShadow)" fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 236 C 466 304, 558 326, 558 396 C 558 452, 512 468, 512 528 L 512 690 M362 556 L 512 706 L 662 556" stroke-width="92"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
