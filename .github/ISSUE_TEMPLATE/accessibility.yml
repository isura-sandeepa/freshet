name: Accessibility report
description: Something in Freshet is hard or impossible to use with your setup.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Barriers are treated as bugs. [ACCESSIBILITY.md](https://github.com/isura-sandeepa/freshet/blob/main/ACCESSIBILITY.md) lists what Freshet supports today.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: checkboxes
    id: setup
    attributes:
      label: What do you use?
      options:
        - label: VoiceOver
        - label: Voice Control
        - label: Full Keyboard Access, or the keyboard only
        - label: Switch Control
        - label: Zoom, or larger text or pointer settings
        - label: Increase Contrast, Reduce Transparency or colour filters
        - label: Reduce Motion
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What you heard, saw or couldn't reach.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Freshet and macOS versions
      placeholder: "Freshet 0.1.0, macOS 15.5"
